name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_COVERAGE_THRESHOLD: '90'

jobs:
  unit_test:
    name: PHP ${{ matrix.php-version }} checks and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, simplexml, xml, xmlwriter
          coverage: pcov
          ini-values: pcov.directory=.
          tools: phpunit:12.5, phpstan:2
        env:
          fail-fast: 'true'
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Run static analysis
        run: phpstan analyse --no-progress
      - name: Run unit tests and print coverage
        run: phpunit --stderr
      - name: Enforce coverage threshold
        run: php tools/check-coverage.php build/coverage.xml

  docker:
    name: Build and test PHP ${{ matrix.php-version }} image
    runs-on: ubuntu-latest
    needs: unit_test
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: password-generator:test
          build-args: PHP_VERSION=${{ matrix.php-version }}
          cache-from: type=gha,scope=php-${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}
      - name: Test running container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs password-generator; docker rm -f password-generator' EXIT
          docker run -d --name password-generator -p 127.0.0.1:8080:8080 password-generator:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/password-page.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent -D /tmp/password-headers http://127.0.0.1:8080/ -o /tmp/password-page.html
          grep -qi '^Cache-Control: no-store' /tmp/password-headers
          python3 - <<'PY'
          import re
          from html import unescape
          from pathlib import Path

          html = Path('/tmp/password-page.html').read_text()
          columns = re.findall(r'<textarea\b[^>]*>(.*?)</textarea>', html, re.S)
          lengths = [6, 7, 8, 9, 18, 32]
          assert len(columns) == 6, f'Expected 6 columns, got {len(columns)}'
          for length, column in zip(lengths, columns):
              passwords = unescape(column).splitlines()
              assert len(passwords) == 12
              for password in passwords:
                  assert len(password) == length
                  assert re.fullmatch(r'[0-9a-zA-Z]+', password)
          PY
          curl --fail --silent http://127.0.0.1:8080/index.php -o /dev/null
          for path in random.php phpunit.xml .git/config; do
            test "$(curl --silent -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$path")" = 404
          done
          test "$(docker exec password-generator id -u)" != 0
          docker exec password-generator php -r '$body = file_get_contents("http://127.0.0.1:8080/"); exit(str_contains($body, "<table") ? 0 : 1);'
          docker image inspect password-generator:test --format 'Image size: {{.Size}} bytes'

  publish:
    name: Publish PHP ${{ matrix.php-version }} image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Prepare image tags
        id: tags
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          image="${DOCKER_HUB_USERNAME}/random-password-generator"
          {
            echo 'tags<<EOF'
            echo "${image}:php${PHP_VERSION}"
            echo "${image}:sha-${GITHUB_SHA}-php${PHP_VERSION}"
            if [ "$PHP_VERSION" = '8.5' ]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: PHP_VERSION=${{ matrix.php-version }}
          cache-from: type=gha,scope=php-${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}
